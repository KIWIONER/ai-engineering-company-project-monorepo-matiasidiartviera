services:
  backend:
    build:
      context: ./services
    ports:
      - "8080:8000"
    volumes:
      # Bind mount para que los cambios en código de Python se reflejen
      - ./services:/app/services
      - ./scripts:/app/scripts
      - ./packages:/app/packages
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - nexova-network
  interfaces:
    build:
      context: ./uis
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      # Bind mounts del código fuente
      - ./uis/website:/app/website
      - ./uis/backoffice:/app/backoffice
      # Volúmenes anónimos para proteger las dependencias de Linux Alpine
      - /app/website/node_modules
      - /app/website/.next
      - /app/backoffice/node_modules
      - /app/backoffice/.next
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    networks:
      - nexova-network

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    networks:
      - nexova-network

  flower:
    image: mher/flower:latest
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - nexova-network

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: nexova-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=0
    networks:
      - nexova-network
volumes:
  qdrant_data:
  
networks:
  nexova-network:
    name: nexova-network
    driver: bridge